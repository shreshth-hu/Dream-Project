<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream us - Sign up</title>
    <link rel="stylesheet" type="text/css" href="./sign.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="shortcut icon" href="Dream-us favicon.jpg" type="image/x-icon" />
  </head>
  <body>
    <!-- Puri body ka dabba 👇 -->
    <div>
      <!-- Loader -->
      <div id="preloader">
        <div class="loader">
          <div class="circle"><span></span></div>
          <div class="circle"><span></span></div>
          <div class="circle"><span></span></div>
          <div class="circle"><i></i></div>
          <div class="circle"><i></i></div>
          <div class="circle"><i></i></div>

          <div class="pre-likha">
            <h1>Loading....</h1>
          </div>
        </div>
      </div>
      <!-- Loader end -->

      <!-- Main bg-effect yha pe niche start -->
      <div class="animation-box">
        <div class="bg-effect"></div>
      </div>
      <!-- Main bg-effect yha pe khatam -->

      <!-- Image aayegi uski photo -->
      <div class="image-effect">
        <img class="imagica" src="Dream-us favicon.jpg" alt="Dream US" />
      </div>
      <!-- Image yha khtm -->

      <!-- Yha pe pura dabba banega -->
      <div class="page-dabba">
        <div class="container">
          <div
            id="g_id_onload"
            data-client_id="97180051145-ao99uhacpl7eu4mrpr7srmjgcqmdf4vc.apps.googleusercontent.com"
            data-context="signin"
            data-ux_mode="popup"
            data-callback="handleCredentialResponse"
            data-auto_prompt="false"
          ></div>

          <div
            class="g_id_signin"
            data-type="standard"
            data-shape="pill"
            data-theme="outline"
            data-text="signin_with"
            data-size="large"
          ></div>

          <p class="likha-poti">
            We have only google right now, <br />
            as they supported us 🙏🫠
          </p>
        </div>
      </div>
      <!-- yha pe dabba khtam -->
    </div>
    <!-- Purii body ka dabba 👆 -->

    <!-- Script yha pe startatat obv... AI se kyoki ye nhi aata -->
    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          let preloader = document.getElementById("preloader");
          preloader.style.opacity = "0";
          preloader.style.visibility = "hidden";
        }, 3500);
      });
    </script>

    <!-- Global container to share Firebase Auth logic with the login callback -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithCredential,
      } from "https://gstatic.com";
      import { getAnalytics } from "https://gstatic.com";

      const firebaseConfig = {
        apiKey: "AIzaSyBdW3lQ8_HSGt8qPhvEFgYSuL9MbRBZ6W0",
        authDomain: "dream-us-501219.firebaseapp.com",
        projectId: "dream-us-501219",
        storageBucket: "dream-us-501219.firebasestorage.app",
        messagingSenderId: "97180051145",
        appId: "1:97180051145:web:5fa994d88f036108bfcf18",
        measurementId: "G-8TXYSZRENN",
      };

      // Initialize Firebase and Authentication
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);

      // Expose the handler function globally so the Google Button callback can see it
      window.handleCredentialResponse = function (response) {
        // 1. Get the login token from the Google Button click
        const credential = GoogleAuthProvider.credential(response.credential);

        // 2. Hand it over to Firebase to register the user in your console
        signInWithCredential(auth, credential)
          .then((result) => {
            console.log(
              "Firebase registration success! User email:",
              result.user.email,
            );
            // Optional: Redirect your user to a welcome page here if needed
          })
          .catch((error) => {
            console.error("Firebase registration failed:", error.message);
          });
      };
    </script>
  </body>
</html>
