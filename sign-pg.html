<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream us - Sign up</title>
    <link rel="stylesheet" type="text/css" href="./sign.css" />

    <script src="https://google.com" async defer></script>
    <link rel="shortcut icon" href="Dream-us favicon.jpg" type="image/x-icon" />
  </head>
  <body>
    <!-- Main Body Container -->
    <div>
      <!-- Loader -->
      <div id="preloader">
        <div class="loader">
          <div class="circle"><span></span></div>
          <div class="circle"><span></span></div>
          <div class="circle"><span></span></div>
          <div class="circle"><i></i></div>
          <div class="circle"><i></i></div>
          <div class="circle"><i></i></div>

          <div class="pre-likha">
            <h1>Loading....</h1>
          </div>
        </div>
      </div>
      <!-- Loader end -->

      <!-- Background Effects -->
      <div class="animation-box">
        <div class="bg-effect"></div>
      </div>

      <!-- Logo Image -->
      <div class="image-effect">
        <img class="imagica" src="Dream-us favicon.jpg" alt="Dream US" />
      </div>

      <!-- Sign In Card -->
      <div class="page-dabba">
        <div class="container">
          <!-- Google Auth Configuration -->
          <div
            id="g_id_onload"
            data-client_id="://googleusercontent.com"
            data-context="signin"
            data-ux_mode="popup"
            data-callback="handleCredentialResponse"
            data-auto_prompt="false"
          ></div>

          <!-- Google Sign In Button -->
          <div
            class="g_id_signin"
            data-type="standard"
            data-shape="pill"
            data-theme="outline"
            data-text="signin_with"
            data-size="large"
          ></div>

          <p class="likha-poti">
            We have only google right now, <br />
            as they supported us 🙏🫠
          </p>
        </div>
      </div>
    </div>

    <!-- STEP 1: Define the Callback Global Function FIRST -->
    <script>
      // Create a global function that Google Library can see immediately
      window.handleCredentialResponse = function (response) {
        console.log("Google Token Received!");

        // Custom event to safely pass the token to the Firebase module below
        const event = new CustomEvent("google-login-success", {
          detail: response.credential,
        });
        window.dispatchEvent(event);
      };
    </script>

    <!-- STEP 2: Initialize Firebase and Listen for the Login Event -->
    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithCredential,
      } from "https://gstatic.com";

      const firebaseConfig = {
        apiKey: "AIzaSyBdW3lQ8_HSGt8qPhvEFgYSuL9MbRBZ6W0",
        authDomain: "://firebaseapp.com",
        projectId: "dream-us-501219",
        storageBucket: "dream-us-501219.firebasestorage.app",
        messagingSenderId: "97180051145",
        appId: "1:97180051145:web:5fa994d88f036108bfcf18",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Listen for the login token event
      window.addEventListener("google-login-success", function (e) {
        const idToken = e.detail;
        const credential = GoogleAuthProvider.credential(idToken);

        signInWithCredential(auth, credential)
          .then((result) => {
            console.log(
              "Successfully logged in via Firebase!",
              result.user.email,
            );
            alert("Welcome! Successfully logged in as: " + result.user.email);
          })
          .catch((error) => {
            console.error("Firebase Auth Error:", error.message);
          });
      });
    </script>

    <!-- STEP 3: Preloader Animation Logic -->
    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          let preloader = document.getElementById("preloader");
          if (preloader) {
            preloader.style.opacity = "0";
            preloader.style.visibility = "hidden";
          }
        }, 3500);
      });
    </script>
  </body>
</html>
